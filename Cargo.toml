[workspace]
members = ["crates/todotxt-core", "crates/todotxt-cli", "crates/todotxt-tui"]
resolver = "2"

[workspace.dependencies]
chrono = { version = "=0.4.44", features = ["serde"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
thiserror = "=2.0.18"
winnow = "=1.0.1"
tempfile = "=3.27.0"
notify-debouncer-mini = "=0.7.0"
clap = { version = "=4.6.1", features = ["derive"] }
clap_complete = "=4.6.2"
anyhow = "=1.0.102"
owo-colors = { version = "=4.3.0", features = ["supports-colors"] }
comfy-table = "=7.2.2"
directories = "=6.0.0"
toml = "=0.8.23"
assert_cmd = "=2.2.0"
assert_fs = "=1.1.3"
predicates = "=3.1.4"
ratatui      = "=0.29.0"
crossterm    = "=0.28.1"
color-eyre   = "=0.6.5"
tui-textarea = "=0.7.0"
