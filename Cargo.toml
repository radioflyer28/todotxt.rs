[workspace]
members = ["crates/todotxt-core", "crates/todotxt-cli", "crates/todotxt-tui"]
resolver = "2"

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
winnow = "1.0"
tempfile = "3"
notify-debouncer-mini = "0.7"
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"
anyhow = "1.0"
owo-colors = { version = "4", features = ["supports-colors"] }
comfy-table = "7"
directories = "6"
toml = "0.8"
assert_cmd = "2"
assert_fs = "1"
predicates = "3"
ratatui      = "0.30"
crossterm    = "0.29"
color-eyre   = "0.6"
tui-textarea = "0.7"
