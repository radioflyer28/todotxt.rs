[workspace]
members = ["crates/todotxt-core", "crates/todotxt-cli"]
resolver = "2"

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
winnow = "1.0"
tempfile = "3"
notify-debouncer-mini = "0.7"
